[project]
name = "coopexecutive"
version = "0.5.0"
description = "El Sistema Directivo Colegiado y Agente Procurador de Fondos con IA para Cooperativas y Asociaciones Civiles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "defusedxml>=0.7.1",
    "tzdata>=2024.1",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
identidad = [
    "pillow>=10.1.0",
]
pdf = [
    "pypdf>=5.0.0",
]
web = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
mcp = [
    "mcp>=2.2",
]
todo = [
    "coopexecutive[identidad,pdf,web,mcp]",
]
dev = [
    "pytest>=8.0.0",
    "pillow>=10.1.0",
    "pypdf>=5.0.0",
    "ruff>=0.15.0",
    "fastapi>=0.115.0",
    "mcp>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pillow>=10.1.0",
    "pypdf>=5.0.0",
    "ruff>=0.15.0",
    "fastapi>=0.115.0",
    "mcp>=2.2",
]

[project.scripts]
coopexecutive = "coopexecutive.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coopexecutive"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042"]  # VoteChoice(str, Enum) conserva su str() histórico

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
markers = [
    "eval: casos dorados de comportamiento (python -m coopexecutive.evals los resume)",
]
