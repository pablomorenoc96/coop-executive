name: "MORECAM Cooperativa de Producción Energética y Tecnológica"
legal_structure: "Sociedad Cooperativa de Responsabilidad Limitada (S.C. de R.L.)"
regime: "Economía Social y Solidaria (Ley General de Sociedades Cooperativas)"
country: "México"
mission: >
  Diseñar, validar, fabricar y desplegar tecnología de generación eólica distribuida
  (aerogeneradores de bajo costo sin bastidor exterior) y sistemas de automatización industrial,
  promoviendo la soberanía técnica, la sustentabilidad ambiental y la emancipación económica
  de comunidades, talleres y productores.
vision: >
  Ser la cooperativa industrial de referencia en México y América Latina que demuestre que
  la alta tecnología de automatización, robótica y energía limpia puede ser propiedad colectiva,
  democrática y éticamente administrada al servicio de los pueblos.
governance:
  supreme_organ: "Asamblea General de Socios (Un socio, un voto)"
  executive_body: "Consejo de Administración"
  supervisory_body: "Consejo de Vigilancia"
  committees:
    - "Comisión de Conciliación y Arbitraje"
    - "Comisión de Educación Cooperativa"
statutory_funds:
  reserve_fund_pct: 15.0
  social_welfare_fund_pct: 10.0
  education_fund_pct: 10.0
values:
  - "Soberanía tecnológica e integridad científica (cero especulación)"
  - "Democracia económica radical (un socio, un voto)"
  - "Primado del trabajo vivo sobre el capital financiero"
  - "Solidaridad comunitaria y justicia ambiental"
  - "Educación y formación técnica continua para la membresía"
target_communities:
  - "Pequeños y medianos productores agrícolas y agroindustriales"
  - "Talleres mecánicos y cooperativas de manufactura local"
  - "Comunidades rurales e insulares con deficiencia en el suministro eléctrico"
strategic_priorities:
  - "Consolidar el desarrollo y certificación del prototipo de aerogenerador sin bastidor exterior"
  - "Vincular el Fondo de Educación Cooperativa con proyectos de titulación universitaria (IPN) y posgrados"
  - "Captar fondos no reembolsables de transición energética justa (FundsforNGOs / Agencias Internacionales)"
  - "Mantener la regla de alcance 100% digital en servicios de consultoría técnica para autofinanciar la I+D"
