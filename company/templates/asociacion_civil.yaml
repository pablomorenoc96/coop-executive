name: "Causas para la Transformación A.C. — Red por la Ciberseguridad"
legal_structure: "Asociación Civil (A.C.) con estatus de Donataria Autorizada (SAT)"
regime: "Persona Moral con Fines No Lucrativos (Título III LISR)"
country: "México"
mission: >
  Fortalecer el ecosistema de ciberseguridad, alfabetización digital e inteligencia artificial
  en México y América Latina mediante la educación, concientización, desarrollo de capacidades
  y protección de derechos digitales de poblaciones vulnerables.
vision: >
  Un entorno digital seguro, inclusivo y resiliente donde la tecnología esté al servicio
  de los derechos humanos y el desarrollo comunitario.
governance:
  supreme_organ: "Asamblea General de Asociados"
  executive_body: "Dirección General y Dirección de Operaciones"
  supervisory_body: "Consejo Consultivo Ciudadano"
values:
  - "Protección irrestricta de derechos humanos en el ciberespacio"
  - "Transparencia radical y rendición de cuentas pública"
  - "Inclusión, equidad de género y no discriminación"
  - "Colaboración multisectorial ética"
focus_areas:
  - "Capacitación y formación de talento técnico en IA y ciberseguridad"
  - "Protección de Niñas, Niños y Adolescentes (NNA) en entornos digitales"
  - "Políticas públicas, transparencia y derechos digitales"
funding_sources:
  - "Subvenciones y fondos internacionales (Grants / FundsforNGOs)"
  - "Donativos deducibles de empresas y fundaciones aliadas"
  - "Convenios de cooperación técnica con universidades y organismos multilaterales"
